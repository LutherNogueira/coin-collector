name: Deploy web build

# Tests the telemetry pipeline and the collection endpoint, builds the statistics data, checks the game, exports it for web and deploys it
# to Vercel: pushes to main go to production, pushes to dev and feature/** branches become preview deployments.
on:
  push:
    branches: [main, dev, 'feature/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # Set in the repository's Settings > Secrets and variables > Actions.
  # Pinned on purpose: this tool runs with the deploy token in its environment, so a new release must be a reviewed change.
  VERCEL_CLI_VERSION: "65.14.0"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and the web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          mkdir -p ~/godot
          curl -fsSL "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" -o ~/godot/godot.zip
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          python3 tools/fetch_web_templates.py --version "${GODOT_VERSION}" --dest ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pipeline/requirements.txt

      - name: Test the telemetry pipeline
        run: |
          pip install -r requirements.txt -r pipeline/requirements.txt
          python -m unittest discover -s pipeline/tests -t .

      - name: Build the statistics data (synthetic demo data through bronze, silver and gold)
        # The game bundles stats/data/gold.json when it is exported, so this has to happen first.
        run: |
          python -m pipeline.generate_synthetic --out pipeline/data/raw/synthetic --days 40
          python -m pipeline.run_pipeline --raw pipeline/data/raw/synthetic --out stats/data/gold.json --label "synthetic demo data"

      - name: Use the real player data when there is any (main only)
        # Production shows real plays as soon as one session has arrived; otherwise (or if anything here fails) the synthetic
        # data from the step above stays. Blob access is a short-lived Vercel credential, never a stored token.
        id: real-data
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # the deploy still goes out, but the next step makes the failure impossible to miss
        run: |
          pip install -r pipeline/requirements-fetch.txt
          npx --yes vercel@${VERCEL_CLI_VERSION} env pull .env.local --environment=production --yes >/dev/null
          python -m pipeline.fetch_blobs --out pipeline/data/raw/blob --skip-session 00000000-0000-4000-8000-000000000000
          # The game export bundles files from the project root, so the credentials file must not outlive the download.
          rm -f .env.local
          python -m pipeline.run_pipeline --raw pipeline/data/raw/blob --out pipeline/data/real_gold.json --label "real plays"
          python -c "
          import json, shutil
          n = json.load(open('pipeline/data/real_gold.json'))['summary']['sessions']
          if n >= 1:
              shutil.copy('pipeline/data/real_gold.json', 'stats/data/gold.json')
          print('real sessions:', n, '-> statistics data is', 'real' if n >= 1 else 'still synthetic')
          "

      - name: Make sure no credentials file is left in the project
        if: always()
        run: rm -f .env.local

      - name: Say so when the real data could not be used
        if: steps.real-data.outcome == 'failure'
        run: |
          echo "::warning title=Real data not used::The statistics screen shipped with the synthetic data. See the step above."
          echo "**Warning:** the real player data step failed, so this deploy ships the synthetic statistics." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the collection endpoint
        run: cd ingest && npm test

      - name: Check the game (Esc menu, statistics screen, event sink and touch controls)
        run: |
          GODOT=$(ls ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64)
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --script res://tests/check_menu.gd
          "$GODOT" --headless --path . --script res://tests/check_stats.gd
          "$GODOT" --headless --path . --script res://tests/check_sender.gd
          "$GODOT" --headless --path . --script res://tests/check_touch.gd

      - name: Export the web build
        run: |
          GODOT=$(ls ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64)
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -s build/web/index.html && test -s build/web/index.wasm && test -s build/web/index.pck

      - name: Add the collection endpoint to the build
        # Vercel only sees build/web, so the serverless function has to be copied in next to the game.
        run: |
          mkdir -p build/web/api
          cp ingest/api/*.js build/web/api/
          cp ingest/package.json build/web/package.json

      - name: Deploy to Vercel
        run: |
          npm install --global vercel@${VERCEL_CLI_VERSION}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then FLAGS="--prod"; else FLAGS=""; fi
          URL=$(vercel deploy build/web $FLAGS --yes)
          echo "Deployed ${GITHUB_REF_NAME}: ${URL}"
          echo "Deployed \`${GITHUB_REF_NAME}\`: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployed ${GITHUB_REF_NAME}::${URL}"
